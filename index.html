button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
header.top{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);border-bottom:3px solid var(--brand-l);box-shadow:0 1px 6px rgba(20,40,70,.06);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;letter-spacing:.2px}
header.top .who{font-size:13px;color:var(--mute)}
.logo{height:38px;width:auto;display:block}
.logo-big{height:84px;width:auto;margin:0 auto 10px;display:block}
.hbtn{background:var(--pri-2);border:0;color:var(--pri);font-weight:600;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + var(--safe-b))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pri);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px;min-width:16px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin:22px 0 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.card.tap{cursor:pointer}
.card.tap:active{background:#f7fafc}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.t{font-weight:600}
.m{color:var(--mute);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:#eef2f5;color:#40525f;white-space:nowrap}
.chip.pri{background:var(--pri-2);color:var(--pri)} .chip.ok{background:var(--ok-2);color:var(--ok)}
.chip.warn{background:var(--warn-2);color:var(--warn)} .chip.bad{background:var(--bad-2);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.tile .n{font-size:24px;font-weight:700}
.tile .l{font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:550}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#f0c9c4}
.btn.big{padding:13px 16px;font-size:16px;width:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.seg{display:flex;background:#e6ecf1;border-radius:10px;padding:3px;gap:2px;overflow-x:auto;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--safe-b));z-index:21;background:var(--pri);color:#fff;border:0;border-radius:28px;padding:14px 18px;font-weight:650;box-shadow:0 4px 14px rgba(52,114,194,.35);cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:28px 10px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px}
.banner.warn{background:var(--warn-2);color:#6e4300}.banner.info{background:var(--pri-2);color:#1d4f8f}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.dlg{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
@media(min-width:700px){.dlg{border-radius:16px}}
.dlg h2{margin-top:0;font-size:18px}
.f{margin-bottom:12px}
.f label.lb{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:550}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid #cfd8df;border-radius:9px;background:#fff}
.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.checks{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:560px){.checks{grid-template-columns:1fr 1fr}}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.checks label.on{border-color:var(--pri);background:var(--pri-2)}
.checks input{margin-top:3px;width:18px;height:18px;flex:none}
.cb{display:flex;gap:8px;align-items:center;font-size:14px}
.cb input{width:18px;height:18px}
.rows{border:1px solid var(--line);border-radius:10px;padding:8px}
.rows .rw{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.rows .rw > *{min-width:0}
.rows input,.rows select{padding:8px!important}
.x{border:0;background:#f3e3e1;color:var(--bad);border-radius:8px;width:32px;height:34px;cursor:pointer;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .sp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv .k{color:var(--mute)}
.tnow{display:flex;gap:6px}.tnow input{flex:1}
.info{background:#f5f8fa;border-radius:9px;padding:9px 11px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));background:#14212b;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.choose{max-width:440px;margin:40px auto;text-align:center}
.choose .card{padding:20px}
.list-date{font-size:13px;font-weight:650;color:var(--mute);margin:14px 2px 6px}
.money{font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .hd{font-size:11px;text-align:center;color:var(--mute);padding:4px 0;font-weight:600;text-transform:uppercase}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:62px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d.out{opacity:.4}
.cal .d.today .dn{background:var(--pri);color:#fff;border-radius:10px;padding:0 6px}
.cal .d.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-2)}
.cal .dn{font-size:12px;font-weight:650;align-self:flex-start}
.cal .ev{font-size:10.5px;line-height:1.25;border-radius:4px;padding:1px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:10px;color:var(--mute)}
.cal .mn{font-size:10px;color:var(--warn)}
@media(min-width:700px){.cal .d{min-height:92px}}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calnav b{flex:1;text-align:center;font-size:16px;text-transform:capitalize}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wk{border-left:4px solid var(--line)}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.media .mi{position:relative;cursor:pointer}
.media img,.media video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#1b2630;display:block}
.media .vt{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:5px;padding:0 5px}
.viewer img,.viewer video{width:100%;max-height:72vh;object-fit:contain;background:#000;border-radius:10px}
.sig{position:relative}
.sig canvas{width:100%;height:170px;border:1.5px dashed #9fb3c4;border-radius:10px;background:#fff;touch-action:none;display:block}
.sig .sigl{position:absolute;left:12px;bottom:10px;font-size:12px;color:#9fb3c4;pointer-events:none}
.sig button{position:absolute;right:8px;top:8px}
.pimg{width:64px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;flex:none;cursor:zoom-in}
.show{position:fixed;inset:0;background:#fff;z-index:90;overflow:auto;padding:calc(12px + var(--safe-t)) 16px calc(20px + var(--safe-b))}
.show .it{border-bottom:1px solid var(--line);padding:18px 0}
.show img{width:100%;max-height:52vh;object-fit:contain;display:block;margin:0 auto 10px}
.mc{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.mc .ph{width:96px;height:76px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--mute);font-size:22px}
.mc .ph img{width:100%;height:100%;object-fit:contain}
.mc .ds{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc .pr{font-size:17px;font-weight:700;margin-top:3px}
.mc-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.new-dot{width:8px;height:8px;border-radius:5px;background:var(--bad);display:inline-block}
</style>
</head>

async function save(col, id, data){
  if (!db) { toast("Dati non raggiungibili: impossibile salvare"); throw new Error("no db"); }
  const ref = id ? db.collection(col).doc(id) : db.collection(col).doc();
  const body = JSON.parse(JSON.stringify({...data, aggiornato: new Date().toISOString(), modificatoDa: ui.modo === "ufficio" ? (ui.uff || "Ufficio") : ui.modo === "comm" ? ui.comm : ui.tecnico || ""}));
  delete body.id;
  try { await ref.set(body); return ref.id; }
  catch(e){ writeErr(e); throw e; }
}
async function patch(col, id, data){
  try { await db.collection(col).doc(id).update(JSON.parse(JSON.stringify({...data, aggiornato: new Date().toISOString()}))); }
  catch(e){ writeErr(e); throw e; }
}
async function remove(col, id){
  try { await db.collection(col).doc(id).delete(); } catch(e){ writeErr(e); throw e; }
}
function writeErr(e){
  if (e && e.code === "invalid_argument") { canWrite = false; toast("Non hai i permessi per modificare i dati. Chiedi al titolare di controllare il tuo account (👤 → Utenti).", 4500); }
  else if (e && e.code === "quota_exceeded") toast("Spazio dati esaurito: elimina dati vecchi.", 4500);
  else toast("Salvataggio non riuscito, riprova.");
}
async function initDb(){

  if (!db) { ui.stale = "nodb"; render(); return; }
  const timer = setTimeout(() => { if (loaded.size < COLS.length) { ui.stale = true; render(); } }, 10000);
  COLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (c === "listino") LISTINO = S.listino.flatMap(ch => (ch.items || []).map((it, i) => ({...it, _c: ch.id, _i: i})));

function notifyReports(snap){
  snap.docChanges().forEach(ch => {
    if (ch.type === "removed") return;
    const d = ch.doc.data(), r = d && d.rapportino;
    if (!r || !r.inviatoIl) return;
    const key = ch.doc.id + r.inviatoIl;
    if (seenReports.has(key)) return;
    seenReports.add(key);
    if (r.inviatoIl > T0 && ui.modo === "ufficio" && !sameTec(d.tecnico, ui.tecnico)) {
      toast("📋 Nuovo rapportino da " + (d.tecnico || "tecnico") + " · " + cliName(d.clienteId), 5000);
    }
  });
}

function closeModal(){ document.querySelectorAll(".ov").forEach(o => o.remove()); }
function modal(html, onMount){
  closeModal();
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="dlg">${html}</div>`;
  ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  if (onMount) onMount(ov.querySelector(".dlg"));
  return ov;
}
function ask(msg, okLabel = "Elimina"){
  return new Promise(res => {
    const ov = modal(`<h2>Conferma</h2><p>${esc(msg)}</p><div class="acts"><span class="sp"></span><button class="btn" data-a="no">Annulla</button><button class="btn bad" data-a="ok">${esc(okLabel)}</button></div>`);

}

function sigToData(cv){
  const sm = document.createElement("canvas"); sm.width = 450; sm.height = 150;
  const c = sm.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, 450, 150); c.drawImage(cv, 0, 0, 450, 150);
  return sm.toDataURL("image/jpeg", 0.7);
}

function openForm(o){

      case "info": return `${lb}<div class="info">${f.html(vals)}</div>`;
      case "sign": return `${lb}<div class="sig"><canvas data-sig="${f.k}" width="900" height="300"></canvas><span class="sigl">${vals[f.k] ? "" : "Firma qui con il dito"}</span><button type="button" class="btn sm" data-sigclr="${f.k}">Cancella</button></div>`;
      case "rows": {
        const rows = Array.isArray(v) ? v : [];
        return `${lb}<div class="rows">${rows.map((r, i) => `<div class="rw" data-row="${i}">${f.cols.map(c => {
          const cv = r[c.k] ?? "";

          return `<input data-c="${c.k}" type="${c.type === "number" ? "text" : "text"}" ${c.type === "number" ? 'inputmode="decimal"' : ""} placeholder="${esc(c.label)}" value="${esc(cv)}" style="flex:${c.w || 1}">`;
        }).join("")}<button type="button" class="x" data-del="${f.k}" data-i="${i}">✕</button></div>`).join("") || `<div class="m" style="padding:4px 2px 8px">Nessuna riga</div>`}<button type="button" class="btn sm" data-add="${f.k}">+ ${esc(f.addLabel || "Aggiungi riga")}</button></div>`;

    let drawing = false, last = null;

    if (t.dataset.sigclr) { vals[t.dataset.sigclr] = ""; rerender(); return; }
    if (t.dataset.now) { readAll(); vals[t.dataset.now] = nowTime(); rerender(); return; }
    if (t.dataset.add) { readAll(); const f = o.fields.find(x => x.k === t.dataset.add); (vals[f.k] = vals[f.k] || []).push(f.newRow ? f.newRow() : {}); rerender(); return; }
    if (t.dataset.del) { readAll(); vals[t.dataset.del].splice(+t.dataset.i, 1); rerender(); return; }
    const a = t.closest("[data-a]")?.dataset.a;
    if (a === "x") ov.remove();
    if (a === "del" && await ask("Eliminare definitivamente?")) { try { await o.onDelete(); } catch(err){} }
  });
  form.addEventListener("submit", async e => {
    e.preventDefault(); readAll();
    const miss = o.fields.filter(f => f.req && (!f.show || f.show(vals)) && (vals[f.k] === "" || vals[f.k] == null));
    if (miss.length) { toast("Compila: " + miss.map(f => f.label).join(", ")); return; }
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    try { await o.onSave(vals); ov.remove(); } catch(err) { btn.disabled = false; }
  });
  return ov;
}

      });

      setTimeout(() => offerCopy(x.id), 80);
    }
  });

const MAX_MB = 20;

async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
    if (b) return {blob: b, type: "image/jpeg"};
  } catch(e){}
  if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return {blob: file, type: file.type};
  return null;
}
function addMedia(intId){

      } else {

        blob = r.blob; type = r.type;

const waLink = (tel, txt) => `https://wa.me/${waNum(tel)}?text=${encodeURIComponent(txt)}`;
const waBtn = (tel, txt, label = "💬 WhatsApp") => tel ? `<a class="btn sm" style="text-decoration:none;color:#128c4a;border-color:#bfe5cf" href="${esc(waLink(tel, txt))}" target="_blank" rel="noopener">${label}</a>` : "";
const csvCell = v => { const t = String(v ?? ""); return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
async function saveCsv(name, header, rows){
  const txt = "\ufeff" + [header, ...rows].map(r => r.map(csvCell).join(";")).join("\n");
  let dl = null; try { dl = await claude.use("downloads"); } catch(e){}
  if (!dl) { toast("Il salvataggio dei file non è disponibile qui", 4000); return; }
  try { await dl.save({filename: name, data: txt}); toast("File pronto: si apre con Excel o Numbers", 3500); } catch(e) { if (e && e.code !== "declined") toast("Salvataggio non riuscito", 3500); }
}
async function toDataURL(src){
  try { const b = await (await fetch(src)).blob(); return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(b); }); } catch(e) { return null; }
}

function dicoFromIntervento(x){

}

async function runMagImport(list){
  const ov = modal(`<h2>Importazione in corso…</h2><p class="m">Non chiudere il gestionale finché non finisce.</p><div class="info" id="mprog">0 / ${list.length}</div><div class="acts"><span class="sp"></span><button class="btn" data-a="stop">Interrompi</button></div>`);
  let stop = false; ov.addEventListener("click", e => { if (e.target.closest("[data-a=stop]")) stop = true; });
  ov.onclick = null;
  let done = 0, nuovi = 0, agg = 0, err = 0;
  const one = async j => {
    const ex = byId("magazzino", j.id);
    const prezzi = {prezzoListino: j.pl, sconto: j.sc, prezzoVendita: j.pc, ...(j.pa !== "" ? {prezzoAcquisto: j.pa} : {})};
    for (let t = 0; t < 6; t++) {
      try {
        if (ex) { await db.collection("magazzino").doc(j.id).update({...prezzi, aggiornato: new Date().toISOString()}); agg++; }
        else { await db.collection("magazzino").doc(j.id).set({...(j.it.img ? {img: j.it.img} : {}), codice: j.it.codice || "", descrizione: j.it.descrizione, categoria: magCatOf(j.it), serie: j.it.categoria || "", fornitore: j.forn, unita: /al metro/i.test(j.it.descrizione) ? "m" : "pz", quantita: 0, scortaMinima: 0, ...prezzi, aggiornato: new Date().toISOString()}); nuovi++; }
        return;
      } catch(e) {
        if (e && (e.code === "resource_exhausted" || e.code === "unavailable")) { await new Promise(r => setTimeout(r, 1500 * (t + 1))); continue; }
        if (e && e.code === "quota_exceeded") { stop = true; toast("Spazio dati esaurito", 5000); }
        err++; return;
      }
    }
    err++;
  };
  for (let i = 0; i < list.length && !stop; i += 4) {
    await Promise.all(list.slice(i, i + 4).map(one));
    done = Math.min(list.length, i + 4);
    const el = document.getElementById("mprog"); if (el) el.textContent = `${done} / ${list.length}`;
  }
  ov.remove();
  toast(`✅ Magazzino: ${nuovi} nuovi, ${agg} aggiornati${err ? `, ${err} non riusciti (rilancia l'importazione)` : ""}`, 6000);
  render();
}
