<style>
:root{
  --bg:#f3f6f9; --card:#fff; --ink:#14212b; --mute:#5f6f7c; --line:#e1e7ec;
  --pri:#3472c2; --pri-2:#e6f0fb; --brand-l:#4db0e7; --brand-r:#ee2332; --ok:#1c8a55; --ok-2:#e2f4ea; --warn:#b26a00; --warn-2:#fdf1dc;
  --bad:#c0392b; --bad-2:#fbe6e3; --r:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
header.top{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);border-bottom:3px solid var(--brand-l);box-shadow:0 1px 6px rgba(20,40,70,.06);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;letter-spacing:.2px}
header.top .who{font-size:13px;color:var(--mute)}
.logo{height:32px;width:auto;display:block}
.btn.wa{background:#e7f7ee;color:#0f6b3a;border-color:#bfe5cf;text-decoration:none;text-align:center;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center}
.fsearch{margin-bottom:6px}.smatch{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}.smatch:empty{display:none}
.smi{text-align:left;background:var(--pri-2);border:0;border-radius:10px;padding:12px;font-weight:600;cursor:pointer;min-height:44px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:8px}.pli{display:flex;align-items:center;gap:10px;border:1px solid var(--line,#e3e7ee);border-radius:10px;padding:8px;background:#fff;text-align:left;width:100%}
.pli .open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit}
.pli img,.pli .ft{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:none;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#b3261e}
.pli .sh{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px;background:#f3f5f8;cursor:pointer;min-height:44px}
.pli .sh.on{background:#e3f4ea;color:#14713f}
.pnote{border-top:1px solid var(--line,#e3e7ee);padding:8px 0}.pnote .m{font-size:12px}
.planimg{width:100%;height:auto;display:block;border-radius:8px;background:#f3f5f8}
@media (max-width:440px){header.top .who{display:none}}
#htitle{min-width:0;flex:1 1 auto;overflow:hidden}#htitle .logo{max-width:100%;height:auto;max-height:32px;object-fit:contain;object-position:left center}
.hqr{flex:none;width:44px;height:44px;border:2px solid var(--brand-l);background:#fff;color:var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.hqr svg{width:26px;height:26px}
.qrcard{text-align:center}.qrcard .qn{font-size:22px;font-weight:700;margin:2px 0 0}.qrcard .qr{color:#C62B24;font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:13px;margin:2px 0 12px}
.qrcard .qrimg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;border:1px solid var(--line,#e3e7ee);border-radius:12px}
.qrcard .qh{font-weight:600;margin:12px 0 4px}.qrcard .qu{background:var(--pri-2);border-radius:12px;padding:10px 12px;margin-top:14px;text-align:left;font-size:14px}
.qrcard .qu b{display:block;margin-bottom:2px}
.logo-big{height:84px;width:auto;margin:0 auto 10px;display:block}
.qimg{flex:0 0 auto;width:52px;height:52px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#fff;text-align:center;font-size:10px;color:var(--mut,#667);line-height:1.2}.qimg img{width:100%;height:100%;object-fit:contain}.qimg.big{width:84px;height:84px}
.pv-sheet{background:#fff;color:#1f2933;border:1px solid var(--line);border-radius:12px;padding:16px;max-height:62vh;overflow:auto}.pv-head{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid #3472C2;padding-bottom:10px;font-size:12px;text-align:right}.pv-head img{height:34px}.pv-tit{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 8px;font-size:17px}.pv-tit span{font-size:13px;color:#667}.pv-cli{background:#f1f5fa;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:14px}.pv-cli small{color:#3472C2;font-weight:700}
.pv-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin-bottom:10px;box-sizing:border-box}.pv-rows{border-top:1px solid var(--line);margin:6px 0}.pv-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.pv-mid{flex:1;min-width:0}.pv-mid textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-weight:600;resize:vertical}.pv-mid input{padding:5px;border:1px solid var(--line);border-radius:7px}.pv-tot{white-space:nowrap;padding-top:6px}.pv-sum{text-align:right;margin:10px 0 14px;line-height:1.7}.pv-sum .big{font-size:18px}
.segwrap{flex-wrap:wrap;overflow:visible}.segwrap button{flex:1 1 30%}
.guida details{border:1px solid var(--line,#dde5ee);border-radius:12px;margin:8px 0;background:#fff}.guida summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style-position:inside}.guida details[open] summary{border-bottom:1px solid var(--line,#dde5ee)}.guida .gbody{padding:4px 14px 10px;line-height:1.5}.guida .gbody p{margin:8px 0}.guida .gbody ul{margin:8px 0;padding-left:20px}
@media(max-width:430px){.hbtn{padding:7px 6px!important}#hguida{padding:7px 5px!important}}
.hbtn{background:var(--pri-2);border:0;color:var(--pri);font-weight:600;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + var(--safe-b))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pri);font-weight:600}
@media (max-width:430px){nav.tabs button{font-size:10px;padding:6px 0;min-width:0;letter-spacing:-.2px}}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px;min-width:16px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin:22px 0 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.card.tap{cursor:pointer}
.card.tap:active{background:#f7fafc}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.t{font-weight:600}
.m{color:var(--mute);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:#eef2f5;color:#40525f;white-space:nowrap}
.chip.pri{background:var(--pri-2);color:var(--pri)} .chip.ok{background:var(--ok-2);color:var(--ok)}
.chip.warn{background:var(--warn-2);color:var(--warn)} .chip.bad{background:var(--bad-2);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.tile .n{font-size:24px;font-weight:700}
.tile .l{font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:550}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#f0c9c4}
.btn.big{padding:13px 16px;font-size:16px;width:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.seg{display:flex;background:#e6ecf1;border-radius:10px;padding:3px;gap:2px;overflow-x:auto;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--safe-b));z-index:21;background:var(--pri);color:#fff;border:0;border-radius:28px;padding:14px 18px;font-weight:650;box-shadow:0 4px 14px rgba(52,114,194,.35);cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:28px 10px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px}
.banner.warn{background:var(--warn-2);color:#6e4300}.banner.info{background:var(--pri-2);color:#1d4f8f}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.dlg{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
@media(min-width:700px){.dlg{border-radius:16px}}
.dlg h2{margin-top:0;font-size:18px}
.f{margin-bottom:12px}
.f label.lb{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:550}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid #cfd8df;border-radius:9px;background:#fff}
.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.checks{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:560px){.checks{grid-template-columns:1fr 1fr}}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.checks label.on{border-color:var(--pri);background:var(--pri-2)}
.checks input{margin-top:3px;width:18px;height:18px;flex:none}
.cb{display:flex;gap:8px;align-items:center;font-size:14px}
.cb input{width:18px;height:18px}
.rows{border:1px solid var(--line);border-radius:10px;padding:8px}
.rows .rw{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.rows .rw > *{min-width:0}
.rows input,.rows select{padding:8px!important}
.x{border:0;background:#f3e3e1;color:var(--bad);border-radius:8px;width:32px;height:34px;cursor:pointer;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .sp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv .k{color:var(--mute)}
.tnow{display:flex;gap:6px}.tnow input{flex:1}
.info{background:#f5f8fa;border-radius:9px;padding:9px 11px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));background:#14212b;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.choose{max-width:440px;margin:40px auto;text-align:center}
.choose .card{padding:20px}
.list-date{font-size:13px;font-weight:650;color:var(--mute);margin:14px 2px 6px}
.money{font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .hd{font-size:11px;text-align:center;color:var(--mute);padding:4px 0;font-weight:600;text-transform:uppercase}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:62px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d.out{opacity:.4}
.cal .d.today .dn{background:var(--pri);color:#fff;border-radius:10px;padding:0 6px}
.cal .d.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-2)}
.cal .dn{font-size:12px;font-weight:650;align-self:flex-start}
.cal .ev{font-size:10.5px;line-height:1.25;border-radius:4px;padding:1px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:10px;color:var(--mute)}
.cal .mn{font-size:10px;color:var(--warn)}
@media(min-width:700px){.cal .d{min-height:92px}}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calnav b{flex:1;text-align:center;font-size:16px;text-transform:capitalize}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wk{border-left:4px solid var(--line)}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.media .mi{position:relative;cursor:pointer}
.media img,.media video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#1b2630;display:block}
.media .vt{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:5px;padding:0 5px}
.viewer img,.viewer video{width:100%;max-height:72vh;object-fit:contain;background:#000;border-radius:10px}
.sig{position:relative}
.sig canvas{width:100%;height:170px;border:1.5px dashed #9fb3c4;border-radius:10px;background:#fff;touch-action:none;display:block}
.sig .sigl{position:absolute;left:12px;bottom:10px;font-size:12px;color:#9fb3c4;pointer-events:none}
.sig button{position:absolute;right:8px;top:8px}
.pimg{width:64px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;flex:none;cursor:zoom-in}
.show{position:fixed;inset:0;background:#fff;z-index:90;overflow:auto;padding:calc(12px + var(--safe-t)) 16px calc(20px + var(--safe-b))}
.show .it{border-bottom:1px solid var(--line);padding:18px 0}
.show img{width:100%;max-height:52vh;object-fit:contain;display:block;margin:0 auto 10px}
.mc{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.mc .ph{width:96px;height:76px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--mute);font-size:22px}
.mc .ph img{width:100%;height:100%;object-fit:contain}
.mc .ds{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc .pr{font-size:17px;font-weight:700;margin-top:3px}
.mc-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.new-dot{width:8px;height:8px;border-radius:5px;background:var(--bad);display:inline-block}
/* ===== Tema "Giovane": viola, corallo e menta ===== */
:root{
  --bg:#f7f5ff; --card:#fff; --ink:#1f1a3d; --mute:#6b6585; --line:#ebe6fa;
  --pri:#6c4cf1; --pri-2:#ece7ff; --brand-l:#6c4cf1; --cor:#ff6b4a; --cor-2:#ffe3da; --cor-ink:#a8361a; --menta:#1fae7a; --menta-2:#d6f5e8; --menta-ink:#0b5a3c;
  --ok:#14915f; --ok-2:#d6f5e8; --warn:#b5520f; --warn-2:#ffead9; --bad:#d63b2f; --bad-2:#ffe0dc; --r:18px;
  --ombra:0 2px 10px rgba(76,52,200,.07);
}
html,body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{border-bottom:0;box-shadow:0 2px 14px rgba(76,52,200,.10)}
.hbtn{border-radius:14px;background:var(--pri-2);color:var(--pri)}
.hqr{border-color:var(--pri);border-radius:14px}
h2{font-weight:800;letter-spacing:-.2px}
h3{color:var(--pri);letter-spacing:.6px;font-weight:800}
.card,.tile,.empty{border:0;box-shadow:var(--ombra)}
.card.tap:active{background:var(--pri-2)}
.tile{border-radius:20px}
.tile .n{font-weight:800;color:var(--pri)}
.tiles>.tile:nth-child(4n+1){background:var(--cor-2)}.tiles>.tile:nth-child(4n+1) .n{color:var(--cor-ink)}.tiles>.tile:nth-child(4n+1) .l{color:var(--cor-ink)}
.tiles>.tile:nth-child(4n+2){background:var(--menta-2)}.tiles>.tile:nth-child(4n+2) .n{color:var(--menta-ink)}.tiles>.tile:nth-child(4n+2) .l{color:var(--menta-ink)}
.tiles>.tile:nth-child(4n+3){background:var(--pri-2)}.tiles>.tile:nth-child(4n+3) .n,.tiles>.tile:nth-child(4n+3) .l{color:#4b2fc9}
.tiles>.tile:nth-child(4n+4){background:#fff4cc}.tiles>.tile:nth-child(4n+4) .n,.tiles>.tile:nth-child(4n+4) .l{color:#7a5600}
.btn{border-radius:22px;border-color:var(--line);font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri)}
.btn.ok{background:var(--menta);border-color:var(--menta)}
.btn.bad{border-color:#ffc9c0}
.fab{background:var(--cor);border-radius:30px;box-shadow:0 6px 18px rgba(255,107,74,.40);font-weight:800}
.chip{border-radius:20px;padding:2px 10px;font-weight:700;background:#f0edf9;color:#4a4468}
.chip.ok{background:var(--menta-2);color:var(--menta-ink)} .chip.warn{background:var(--warn-2);color:var(--warn)} .chip.bad{background:var(--bad-2);color:#a32a20}
.seg{background:#ebe6fa;border-radius:16px}.seg button{border-radius:12px}.seg button.on{background:var(--pri);color:#fff}
.search,.f input:not([type=checkbox]),.f select,.f textarea{border-radius:14px;border-color:#dcd5f3}
.search:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.checks label{border-radius:14px}
.dlg{border-radius:26px 26px 0 0}
@media(min-width:700px){.dlg{border-radius:26px}}
.info{background:var(--pri-2);border-radius:14px}
.banner{border-radius:16px}.banner.info{background:var(--pri-2);color:#4b2fc9}
.empty{border-radius:20px;color:var(--mute)}
nav.tabs{border-top:0;box-shadow:0 -2px 14px rgba(76,52,200,.08)}
nav.tabs button.on{color:var(--pri);font-weight:800}
nav.tabs button.on svg{background:var(--pri-2);border-radius:12px;padding:3px 10px;width:44px;height:28px;box-sizing:border-box}
.badge{background:var(--cor)}
.cal .d{border:0;box-shadow:var(--ombra);border-radius:12px}
.cal .d.today .dn{background:var(--cor)}
.toast{background:var(--ink);border-radius:18px}
.grid2>*{min-width:0}.tnow input{min-width:0;width:auto!important}.tnow .btn{padding-left:10px;padding-right:10px}
.hero{background:var(--pri);color:#fff;border-radius:24px;padding:16px 18px;margin:4px 0 14px;display:flex;align-items:center;gap:12px}
.hero .hc{font-size:13px;opacity:.9}.hero .hd{font-size:20px;font-weight:800;line-height:1.2}
.hero .hn{margin-left:auto;background:var(--cor);border-radius:18px;padding:8px 12px;text-align:center;font-weight:800;font-size:22px;line-height:1}.hero .hn small{display:block;font-size:11px;font-weight:700;margin-top:2px}
</style>
</head>

async function save(col, id, data){
  if (!db) { toast("Dati non raggiungibili: impossibile salvare"); throw new Error("no db"); }
  const ref = id ? db.collection(col).doc(id) : db.collection(col).doc();
  const body = JSON.parse(JSON.stringify({...data, aggiornato: new Date().toISOString(), modificatoDa: ui.modo === "ufficio" ? (ui.uff || "Ufficio") : ui.modo === "comm" ? ui.comm : ui.tecnico || ""}));
  delete body.id;
  try { await ref.set(body); return ref.id; }
  catch(e){ writeErr(e); throw e; }
}
async function patch(col, id, data){
  try { await db.collection(col).doc(id).update(JSON.parse(JSON.stringify({...data, aggiornato: new Date().toISOString()}))); }
  catch(e){ writeErr(e); throw e; }
}
async function remove(col, id){
  try { await db.collection(col).doc(id).delete(); } catch(e){ writeErr(e); throw e; }
}
function writeErr(e){
  if (e && (e.code === "invalid_argument" || e.code === "permission-denied")) { canWrite = false; toast("Non hai i permessi per modificare i dati. Chiedi al titolare di controllare il tuo account (👤 → Utenti).", 4500); }
  else if (e && e.code === "quota_exceeded") toast("Spazio dati esaurito: elimina dati vecchi.", 4500);
  else toast("Salvataggio non riuscito, riprova.");
}

function notifyReports(snap){
  snap.docChanges().forEach(ch => {
    if (ch.type === "removed") return;
    const d = ch.doc.data(), r = d && d.rapportino;
    if (!r || !r.inviatoIl) return;
    const key = ch.doc.id + r.inviatoIl;
    if (seenReports.has(key)) return;
    seenReports.add(key);
    if (r.inviatoIl > T0 && ui.modo === "ufficio" && !sameTec(d.tecnico, ui.tecnico)) {
      toast("📋 Nuovo rapportino da " + (d.tecnico || "tecnico") + " · " + cliName(d.clienteId), 5000);
    }
  });
}

  const readAll = () => {
    o.fields.forEach(f => {
      const w = fb.querySelector(`[data-f="${f.k}"]`); if (!w) return;
      if (f.type === "checkbox") vals[f.k] = w.querySelector("input").checked;
      else if (f.type === "checks") vals[f.k] = [...w.querySelectorAll("input:checked")].map(i => i.value);
      else if (f.type === "rows") vals[f.k] = [...w.querySelectorAll(".rw")].map(rw => { const r = {}; f.cols.forEach(c => { const el = rw.querySelector(`[data-c="${c.k}"]`); r[c.k] = c.type === "number" ? (el.value === "" ? "" : num(el.value)) : el.value; }); return r; });
      else if (f.type === "info" || f.type === "sign") {}
      else { const el = w.querySelector("[data-k]"); if (el) vals[f.k] = f.type === "number" ? (el.value === "" ? "" : num(el.value)) : el.value; }
    });
  };
  const initSigs = () => fb.querySelectorAll("canvas[data-sig]").forEach(cv => {
    const k = cv.dataset.sig, ctx = cv.getContext("2d");
    ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#10233a";
    if (vals[k]) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, cv.width, cv.height); im.src = vals[k]; }
    let drawing = false, last = null;
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    cv.addEventListener("pointerdown", e => { e.preventDefault(); drawing = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch(err){} ctx.beginPath(); ctx.arc(last[0], last[1], 2, 0, 7); ctx.fill(); const l = cv.parentNode.querySelector(".sigl"); if (l) l.textContent = ""; });
    cv.addEventListener("pointermove", e => { if (!drawing) return; e.preventDefault(); const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
    const end = () => { if (!drawing) return; drawing = false; vals[k] = sigToData(cv); };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("pointerleave", end);
  });
  const rerender = () => { const a = document.activeElement; const key = a && (a.dataset.k || ""); fb.innerHTML = body(); initSigs(); if (key) { const el = fb.querySelector(`[data-k="${key}"]`); if (el && el.type !== "checkbox") { el.focus(); try { const L = el.value.length; el.setSelectionRange && el.setSelectionRange(L, L); } catch(e){} } } };
  const refreshInfo = () => o.fields.filter(f => f.type === "info").forEach(f => { const w = fb.querySelector(`[data-f="${f.k}"] .info`); if (w) w.innerHTML = f.html(vals); });
  initSigs();
  const normS = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const showMatches = inp => {
    const k = inp.dataset.s, f = o.fields.find(x => x.k === k), box = fb.querySelector(`[data-sm="${k}"]`); if (!f || !box) return;
    const q = normS(inp.value).trim(); if (!q) { box.innerHTML = ""; return; }
    const opts = (typeof f.options === "function" ? f.options(vals) : f.options || []).map(op => Array.isArray(op) ? op : [op, op]).filter(([v]) => v !== "");
    const words = t => normS(t).split(/[\s·.,'’\-\/]+/);
    const rank = t => normS(t).startsWith(q) ? 0 : words(t).some(w => w.startsWith(q)) ? 1 : normS(t).includes(q) ? 2 : 9;
    const res = opts.map(o => [o, rank(o[1])]).filter(([, r]) => r < 9).sort((a, b) => a[1] - b[1]).map(([o]) => o).slice(0, 8);
    box.innerHTML = res.length ? res.map(([v, t]) => `<button type="button" class="smi" data-pick="${esc(k)}" data-v="${esc(v)}">${esc(t)}</button>`).join("") : `<div class="m" style="padding:6px 2px">Nessun risultato per "${esc(inp.value)}"</div>`;
  };
  fb.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.s) { showMatches(e.target); return; } readAll(); if (o.onInput) o.onInput(vals); refreshInfo(); });
  fb.addEventListener("change", e => {
    if (e.target.dataset && e.target.dataset.s) return;
    readAll();
    const k = e.target.dataset.k || e.target.dataset.ck || e.target.closest("[data-f]")?.dataset.f;
    const f = o.fields.find(x => x.k === k);
    if (f && f.onChange) f.onChange(vals);
    if (o.onChange) o.onChange(vals, k);
    if (f && (f.rerender || f.type === "checks" || f.type === "checkbox" || f.type === "rows")) rerender(); else refreshInfo();
  });
  ov.addEventListener("click", async e => {
    const t = e.target;
    if (t.closest && t.closest("[data-pick]")) {
      const b = t.closest("[data-pick]"), k = b.dataset.pick, f = o.fields.find(x => x.k === k);
      readAll(); vals[k] = b.dataset.v;
      const sel = fb.querySelector(`select[data-k="${k}"]`); if (sel) sel.value = b.dataset.v;
      const inp = fb.querySelector(`[data-s="${k}"]`); if (inp) inp.value = "";
      const box = fb.querySelector(`[data-sm="${k}"]`); if (box) box.innerHTML = "";
      if (f && f.onChange) f.onChange(vals);
      if (o.onChange) o.onChange(vals, k);
      if (f && f.rerender) rerender(); else refreshInfo();
      return;
    }
    if (t.dataset.sigclr) { vals[t.dataset.sigclr] = ""; rerender(); return; }
    if (t.dataset.now) { readAll(); vals[t.dataset.now] = nowTime(); rerender(); return; }
    if (t.dataset.add) { readAll(); const f = o.fields.find(x => x.k === t.dataset.add); (vals[f.k] = vals[f.k] || []).push(f.newRow ? f.newRow() : {}); rerender(); return; }
    if (t.dataset.del) { readAll(); vals[t.dataset.del].splice(+t.dataset.i, 1); rerender(); return; }
    const a = t.closest("[data-a]")?.dataset.a;
    if (a === "x") ov.remove();
    if (a === "del" && await ask("Eliminare definitivamente?")) { try { await o.onDelete(); } catch(err){} }
  });
  form.addEventListener("submit", async e => {
    e.preventDefault(); readAll();
    const miss = o.fields.filter(f => f.req && (!f.show || f.show(vals)) && (vals[f.k] === "" || vals[f.k] == null));
    if (miss.length) { toast("Compila: " + miss.map(f => f.label).join(", ")); return; }
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    try { await o.onSave(vals); ov.remove(); } catch(err) { btn.disabled = false; }
  });
  return ov;
}

async function fotoDoc(cid){
  if (!isUff()) return; // solo l'ufficio
  if (!assetsNS) { toast("Il caricamento dei file non è attivo per il tuo account. Controlla la connessione o chiedi al titolare.", 4500); return; }
  const salva = async up => {
    const c = byId("commesse", cid), n = ((c && c.documenti) || []).filter(d => d.fotografato).length + 1;
    const doc = {id: up.id, url: up.url, nome: `Documento fotografato ${n} (${new Date().toLocaleDateString("it-IT")})`, ext: "jpg", tipo: "foto", categoria: "Altro", fotografato: true,
      condiviso: false, da: chiSono(), il: new Date().toISOString(), note: []};
    await patch("commesse", cid, {documenti: [...((c && c.documenti) || []), doc]});
    setTimeout(refreshComm, 300);
  };
  if (isDesktop()) {
    const c = byId("commesse", cid);
    const up = await chiediFotoTelefono(`Documento per la commessa ${(c && c.numero) || ""} · ${cliName(c && c.clienteId)}`);
    if (up) { try { await salva(up); toast("📄 Documento salvato nella commessa", 3000); } catch(e){} }
    return;
  }
  camIn.value = "";
  camIn.onchange = async () => {
    const f = camIn.files[0]; if (!f) return;
    toast("Salvo la foto del documento…", 60000);
    try {
      const r = await shrinkImage(f, 2600); if (!r) throw {code: "unsupported_type"};
      const up = await assetsNS.upload(r.blob, {type: r.type});
      await salva(up);
      clearToasts(); toast("📄 Documento salvato. Tocca di nuovo 📷 per un'altra pagina.", 3500);
    } catch(e) { clearToasts(); toast("Non sono riuscito a salvare la foto, riprova." + errDet(e), 6000); }
  };
  camIn.click();
}

// Il PC crea scansioni/{token} = {stato: "attesa", uid, etichetta, creato}; il telefono (stesso account, o chi inquadra il QR)
// scatta la foto, la carica e scrive {stato: "fatto", url, assetId}; il PC la riceve subito.
const isDesktop = () => !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const mioUid = () => { try { return (window.firebase && firebase.auth().currentUser && firebase.auth().currentUser.uid) || ""; } catch(e) { return ""; } };
const scanMie = new Set();
function chiediFotoTelefono(etichetta, tipo = "foto"){
  const bc = tipo === "barcode";
  return new Promise(async resolve => {
    if (!db) { toast("Dati non raggiungibili"); return resolve(null); }
    const token = Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    scanMie.add(token);
    const ref = db.collection("scansioni").doc(token);
    try { await ref.set({stato: "attesa", tipo, uid: mioUid(), etichetta: etichetta || "Foto", da: chiSono(), creato: new Date().toISOString()}); }
    catch(e) { writeErr(e); return resolve(null); }
    try { await loadQR(); } catch(e){}
    const link = location.origin + location.pathname + "#scan-" + token;
    const ov = document.createElement("div"); ov.className = "ov"; ov.style.zIndex = 80;
    ov.innerHTML = `<div class="dlg" style="text-align:center;max-width:460px">
      <h2>${bc ? "▦ Leggi il codice a barre" : "📱 Scatta la foto con il telefono"}</h2>
      <p style="margin:0 0 6px"><b>${esc(etichetta || "")}</b></p>
      ${bc ? `<label class="lb" for="bcman" style="display:block;text-align:left">Scrivi il codice, oppure usa il lettore USB</label>
      <div class="row" style="gap:8px;margin-bottom:10px"><input id="bcman" inputmode="text" autocomplete="off" style="flex:1"><button class="btn pri" data-x="man">Usa</button></div>
      <p class="m" style="margin-top:0">Oppure apri il gestionale sul telefono (o inquadra il QR) e leggi il codice con la fotocamera.</p>`
      : `<p class="m" style="margin-top:0">Apri il gestionale sul telefono: comparirà da solo il pulsante per scattare la foto.<br>Oppure inquadra questo QR con la fotocamera del telefono.</p>`}
      ${window.iteamQRsvg ? `<div style="max-width:220px;margin:0 auto">${window.iteamQRsvg(link, "M")}</div>` : ""}
      <p class="m" id="scst" style="font-weight:600;margin-top:10px">⏳ ${bc ? "In attesa del codice…" : "In attesa della foto…"}</p>
      <div class="acts"><span class="sp"></span><button class="btn" data-x="no">Annulla</button></div></div>`;
    document.body.appendChild(ov);
    if (bc) setTimeout(() => ov.querySelector("#bcman")?.focus(), 50);
    let fatto = false;
    const stop = ref.onSnapshot(s => {
      const d = s.exists ? s.data() : null; if (!d || fatto) return;
      if (d.stato === "scatto") { const st = ov.querySelector("#scst"); if (st) st.textContent = "📷 Il telefono sta caricando la foto…"; }
      if (d.stato === "fatto" && d.codice) { fatto = true; stop(); ov.remove(); toast("✅ Codice arrivato dal telefono"); resolve({codice: d.codice}); ref.delete().catch(() => {}); return; }
      if (d.stato === "fatto" && d.url) { fatto = true; stop(); ov.remove(); toast("✅ Foto arrivata dal telefono"); resolve({id: d.assetId, url: d.url}); ref.delete().catch(() => {}); }
    }, () => {});
    const chiudi = val => { fatto = true; try { stop(); } catch(err){} ov.remove(); ref.set({stato: "annullata"}, {merge: true}).catch(() => {}); resolve(val); };
    const manuale = () => { const v = (ov.querySelector("#bcman")?.value || "").trim(); if (v) chiudi({codice: v}); };
    ov.addEventListener("click", e => {
      if (e.target.dataset.x === "no") chiudi(null);
      if (e.target.dataset.x === "man") manuale();
    });
    ov.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "bcman") { e.preventDefault(); manuale(); } });
  });
}
// Sul telefono: richieste in attesa (dal QR o per lo stesso account)
let scanAperta = "";
function mostraRichiestaFoto(token, d){
  if (!token || scanAperta === token || scanMie.has(token) || isDesktop()) return;
  if (d && (d.stato !== "attesa" || Date.now() - new Date(d.creato).getTime() > 15 * 60000)) return;
  scanAperta = token;
  const ov = document.createElement("div"); ov.className = "ov"; ov.style.zIndex = 90;
  ov.innerHTML = `<div class="dlg" style="text-align:center">
    <h2>💻 ${d && d.tipo === "barcode" ? "Il PC ti chiede un codice a barre" : "Il PC ti chiede una foto"}</h2>
    <p><b>${esc((d && d.etichetta) || "Foto")}</b>${d && d.da ? `<br><span class="m">richiesta da ${esc(d.da)}</span>` : ""}</p>
    ${d && d.tipo === "barcode" ? `<button class="btn pri big" data-x="leggi" style="width:100%">▦ Leggi il codice a barre</button>` : `<button class="btn pri big" data-x="scatta" style="width:100%">📷 Apri la fotocamera</button>`}
    <div class="acts"><span class="sp"></span><button class="btn" data-x="no">Non ora</button></div></div>`;
  document.body.appendChild(ov);
  const ref = db.collection("scansioni").doc(token);
  ov.addEventListener("click", e => {
    const a = e.target.closest("[data-x]")?.dataset.x; if (!a) return;
    if (a === "no") { ov.remove(); return; }
    if (a === "leggi") {
      ov.remove();
      leggiCodice("Codice per il PC").then(async code => {
        if (!code) return;
        try { await ref.set({stato: "fatto", codice: code}, {merge: true}); toast("✅ Codice inviato al PC: " + code, 3000); } catch(err) { toast("Codice non inviato, riprova." + errDet(err), 5000); }
        if (location.hash.startsWith("#scan-")) history.replaceState(null, "", location.pathname);
      });
      return;
    }
    if (a === "scatta") {
      camIn.value = "";
      camIn.onchange = async () => {
        const f = camIn.files[0]; if (!f) return;
        ov.remove(); toast("Invio la foto al PC…", 60000);
        try {
          await ref.set({stato: "scatto"}, {merge: true});
          const r = await shrinkImage(f, 2600); if (!r) throw {code: "unsupported_type"};
          const up = await assetsNS.upload(r.blob, {type: r.type});
          await ref.set({stato: "fatto", url: up.url, assetId: up.id}, {merge: true});
          clearToasts(); toast("✅ Foto inviata al PC", 3000);
        } catch(err) { clearToasts(); toast("Foto non inviata, riprova dal PC." + errDet(err), 6000); }
        if (location.hash.startsWith("#scan-")) history.replaceState(null, "", location.pathname);
      };
      camIn.click();
    }
  });
}
function avviaAscoltoScansioni(){
  if (!db || isDesktop()) return;
  const h = location.hash.match(/^#scan-([a-z0-9]+)$/);
  if (h) db.collection("scansioni").doc(h[1]).get().then(s => { if (s.exists) mostraRichiestaFoto(h[1], s.data()); else toast("Richiesta di foto scaduta o già completata"); }).catch(() => {});
  const uid = mioUid(); if (!uid || avviaAscoltoScansioni.on) return;
  try {
    avviaAscoltoScansioni.on = true;
    db.collection("scansioni").where("uid", "==", uid).where("stato", "==", "attesa").onSnapshot(q => {
      q.docs.forEach(s => mostraRichiestaFoto(s.id, s.data()));
    }, () => { avviaAscoltoScansioni.on = false; });
  } catch(e) { avviaAscoltoScansioni.on = false; }
}
window.addEventListener("hashchange", () => { if (location.hash.startsWith("#scan-")) avviaAscoltoScansioni(); });

function addDocs(cid){
  if (!assetsNS) { toast("Il caricamento dei file non è attivo per il tuo account. Controlla la connessione o chiedi al titolare.", 4500); return; }
  docIn.value = "";
  docIn.onchange = async () => {
    const files = [...docIn.files]; if (!files.length) return;
    const added = []; let i = 0;
    for (const f of files) {
      i++; toast(`Caricamento ${i} di ${files.length}…`, 120000);
      const ext = ((f.name || "").match(/\.([a-z0-9]+)$/i) || [, ""])[1].toLowerCase();
      const isPdf = f.type === "application/pdf" || ext === "pdf", isImg = !isPdf && (f.type || "").startsWith("image/");
      let blob = f, type = isPdf ? "application/pdf" : (f.type || "application/octet-stream");
      if (isImg && !(/^image\/(jpeg|png|webp)$/.test(f.type) && f.size <= MAX_MB * 1048576)) {
        const r = await shrinkImage(f, 4096); if (!r) { clearToasts(); toast(`Formato non supportato: ${f.name}`, 4500); continue; } blob = r.blob; type = r.type;
      }
      if (blob.size > 45 * 1048576) { clearToasts(); toast(`File troppo grande: ${f.name} (massimo 45 MB)`, 4500); continue; }
      try {
        const up = await assetsNS.upload(blob, {type});
        const nome = String(f.name || "Documento").replace(/\.[a-z0-9]+$/i, "");
        added.push({id: up.id, url: up.url, nome, ext, tipo: isPdf ? "pdf" : isImg ? "foto" : "file", categoria: /plan|pianta|piano/i.test(nome) ? "Planimetria" : isImg ? "Foto" : "Altro", condiviso: false, da: chiSono(), il: new Date().toISOString(), note: []});
      } catch(e) {
        clearToasts();
        toast(`Non riesco a caricare "${f.name}".` + errDet(e), 6000);
      }
    }
    clearToasts();
    if (!added.length) return;
    const c = byId("commesse", cid);
    try { await patch("commesse", cid, {documenti: [...((c && c.documenti) || []), ...added]}); toast(`📁 ${added.length} document${added.length === 1 ? "o caricato" : "i caricati"}. Scegli quali far vedere ai tecnici (👷).`, 4500); } catch(e){}
    setTimeout(refreshComm, 300);
  };
  docIn.click();
}

const MAX_MB = 20;
const fileIn = document.createElement("input");
fileIn.type = "file"; fileIn.accept = "image/*,video/*"; fileIn.multiple = true; fileIn.hidden = true;

async function shrinkImage(file, maxSide = 1920){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
    if (b) return {blob: b, type: "image/jpeg"};
  } catch(e){}
  if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return {blob: file, type: file.type};
  return null;
}

async function caricaFile(intId, files){
    if (!files.length) return 0;
    const added = []; let i = 0;

// ---------- appuntamenti nel calendario del telefono (.ics, con avviso) ----------
function icsEsc(v){ return String(v || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/([,;])/g, "\\$1"); }
function icsFold(l){ let o = ""; while (l.length > 73) { o += l.slice(0, 73) + "\r\n "; l = l.slice(73); } return o + l; }
function icsEvento(x){
  if (isCant(x)) return giorniInt(x).map((d, i, a) => icsEvento({...x, cantiere: false, _uid: x.id + "-" + d, data: d, ora: oraDelGiorno(x, d), _fine: x.oraFine || "17:00", _giorno: `giorno ${i + 1} di ${a.length}`, _noAllarme: i > 0})).join("\r\n");
  const c = byId("clienti", x.clienteId), imp = byId("impianti", x.impiantoId);
  const d = (x.data || today()).replace(/-/g, ""), pad = n => String(n).padStart(2, "0");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const conOra = /^\d{1,2}:\d{2}$/.test(x.ora || "");
  const L = ["BEGIN:VEVENT", "UID:" + (x._uid || x.id) + "@gestionale-iteam", "DTSTAMP:" + stamp];
  if (/^\d{1,2}:\d{2}$/.test(x.ora || "")) {
    const [h, m] = x.ora.split(":").map(Number), fine = /^\d{1,2}:\d{2}$/.test(x._fine || "") && minsBetween(x.ora, x._fine) > 0 ? h * 60 + m + minsBetween(x.ora, x._fine) : h * 60 + m + 60;
    const dFine = fine >= 1440 ? addDays(x.data, 1).replace(/-/g, "") : d;
    L.push(`DTSTART:${d}T${pad(h)}${pad(m)}00`, `DTEND:${dFine}T${pad(Math.floor(fine / 60) % 24)}${pad(fine % 60)}00`);
  } else {
    L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${addDays(x.data || today(), 1).replace(/-/g, "")}`);
  }
  L.push("SUMMARY:" + icsEsc(`iTeam · ${x._giorno ? "Cantiere (" + x._giorno + ")" : x.tipo || "Intervento"} · ${c?.nome || "Cliente"}`));
  if (c && addr(c)) L.push("LOCATION:" + icsEsc(addr(c)));
  L.push("DESCRIPTION:" + icsEsc([imp && "Impianto: " + impName(imp), x.descrizione, c?.telefono && "Tel. cliente: " + c.telefono, tecTxt(x) && (tecDi(x).length > 1 ? "Tecnici: " : "Tecnico: ") + tecTxt(x)].filter(Boolean).join("\n")));
  if (!x._noAllarme) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + (conOra ? "Appuntamento tra 1 ora" : "Appuntamento domani"), "TRIGGER:" + (conOra ? "-PT1H" : "-PT6H"), "END:VALARM");
  L.push("END:VEVENT");
  return L.map(icsFold).join("\r\n");
}
function apriIcs(list, nome){
  if (!list.length) return toast("Nessun appuntamento da aggiungere");
  const txt = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//iTeam//Gestionale//IT", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...list.map(icsEvento), "END:VCALENDAR"].join("\r\n");
  const blob = new Blob([txt], {type: "text/calendar;charset=utf-8"}), url = URL.createObjectURL(blob);
  const iOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const a = document.createElement("a"); a.href = url; if (!iOS) a.download = nome + ".ics";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
  toast(iOS ? "Tocca «Aggiungi tutto» per salvarlo nel calendario" : "Apri il file per aggiungerlo al calendario", 4000);
}

const TEC_COL = ["#3472c2","#ee2332","#1c8a55","#b26a00","#7b3fb8","#0f8b8d","#c2417a","#5a6b2f"];
const tecColor = n => { if (!n) return "#8a99a6"; const l = tecnici(); const i = l.findIndex(x => sameTec(x, n)); return TEC_COL[(i < 0 ? 0 : i) % TEC_COL.length]; };
const monStart = d => { const x = new Date(d + "T12:00:00"); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return iso(x); };
function vCalendario(fixedTec){
  ui.calFixed = fixedTec || "";
  if (!fixedTec && ui.calImp && sonoTitolare()) return vTrasfCal();
  const t = today();
  if (!ui.calSel) ui.calSel = t;
  if (!ui.calM) ui.calM = ui.calSel.slice(0, 7);
  const tec = fixedTec || ui.calTec;
  let ints = S.interventi.filter(x => x.stato !== "Annullato");
  if (tec) ints = ints.filter(x => tec === "-" ? !x.tecnico : haTec(x, tec));
  const byDay = {}; ints.forEach(x => giorniInt(x).forEach(d => { (byDay[d] = byDay[d] || []).push(x); }));
  Object.entries(byDay).forEach(([d, l]) => l.sort((a, b) => oraDelGiorno(a, d).padStart(5, "0").localeCompare(oraDelGiorno(b, d).padStart(5, "0")) || sortInt(a, b)));
  const manDay = {}; if (!fixedTec) S.impianti.forEach(i => { if (i.prossimaManutenzione) (manDay[i.prossimaManutenzione] = manDay[i.prossimaManutenzione] || []).push(i); });
  const label = x => byId("clienti", x.clienteId)?.nome || x.tipo || "Intervento";
  let head, grid;
  if (ui.calView === "mese") {
    const first = ui.calM + "-01"; const start = monStart(first);
    const mName = new Date(first + "T12:00:00").toLocaleDateString("it-IT", {month: "long", year: "numeric"});
    head = mName;
    let cells = ""; let d = start;
    for (let k = 0; k < 42; k++) {
      if (k === 35 && d.slice(0, 7) !== ui.calM) break;
      const l = byDay[d] || [], mn = manDay[d] || [];
      cells += `<div class="d ${d.slice(0, 7) !== ui.calM ? "out" : ""} ${d === t ? "today" : ""} ${d === ui.calSel ? "sel" : ""}" data-cald="${d}"><span class="dn">${+d.slice(8)}</span>${l.slice(0, 3).map(x => `<span class="ev" style="background:${tecColor(x.tecnico)}${x.stato === "Completato" ? ";opacity:.55" : ""}">${isCant(x) ? "🏗️ " : ""}${esc(label(x))}</span>`).join("")}${l.length > 3 ? `<span class="more">+${l.length - 3}</span>` : ""}${mn.length ? `<span class="mn">🔧 ${mn.length} scad.</span>` : ""}</div>`;
      d = addDays(d, 1);
    }
    grid = `<div class="cal">${["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(x => `<div class="hd">${x}</div>`).join("")}${cells}</div>`;
  } else {
    const ws = monStart(ui.calSel); const we = addDays(ws, 6);
    head = fd(ws).replace(/ \d{4}$/, "") + " – " + fd(we);
    grid = "";
    for (let k = 0; k < 7; k++) {
      const d = addDays(ws, k), l = byDay[d] || [], mn = manDay[d] || [];
      grid += `<div class="list-date" style="${d === t ? "color:var(--pri)" : ""}">${esc(fdl(d))}${d === t ? " · oggi" : ""}${fixedTec ? "" : ` <button class="btn sm" style="float:right;padding:2px 8px" data-calnew="${d}">+</button>`}</div>`;
      grid += l.length ? l.map(x => intCard(x, {noTec: !!fixedTec, giorno: d}).replace('class="card tap"', `class="card tap wk" style="border-left-color:${tecColor(x.tecnico)}"`)).join("") : `<div class="m" style="padding:2px 4px 6px">Nessun intervento</div>`;
      if (mn.length) grid += mn.map(i => `<div class="m" style="padding:0 4px 6px">🔧 Scade manutenzione: ${esc(cliName(i.clienteId))} · ${esc(impName(i))} <button class="btn sm" data-prog="${i.id}">Programma</button></div>`).join("");
    }
  }
  const selL = byDay[ui.calSel] || [], selM = manDay[ui.calSel] || [];
  const tl = tecnici();
  const tcal = !fixedTec && sonoTitolare() ? (S.calCfg && S.calCfg.icloudUrl ? `<div class="card tap" data-tcal="apri" style="background:var(--pri-2)"><b>📱 Trasferimento dal calendario iPhone</b> · ${evCalDaFare().length} appuntament${evCalDaFare().length === 1 ? "o" : "i"} da trasferire</div>` : `<button class="btn sm" data-tcal="apri" style="margin-bottom:10px">📱 Trasferisci i miei appuntamenti dall'iPhone</button>`) : "";
  return `${fixedTec ? "" : "<h2>Calendario</h2>" + tcal}
  <div class="seg"><button class="${ui.calView === "mese" ? "on" : ""}" data-calv="mese">Mese</button><button class="${ui.calView === "settimana" ? "on" : ""}" data-calv="settimana">Settimana</button></div>
  <div class="calnav"><button class="btn sm" data-calmv="-1">‹</button><b>${esc(head)}</b><button class="btn sm" data-calmv="1">›</button><button class="btn sm" data-calmv="0">Oggi</button></div>
  ${fixedTec ? "" : `<select class="search" data-caltec><option value="">Tutti i tecnici</option><option value="-" ${ui.calTec === "-" ? "selected" : ""}>Da assegnare</option>${tl.map(n => `<option ${sameTec(n, ui.calTec) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`}
  ${grid}
  ${!fixedTec && tl.length ? `<div class="legend">${tl.map(n => `<span><i style="background:${tecColor(n)}"></i>${esc(n)}</span>`).join("")}<span><i style="background:#8a99a6"></i>Da assegnare</span></div>` : ""}
  ${ui.calView === "mese" ? `<div class="list-date" style="font-size:15px;color:var(--ink)">${esc(fdl(ui.calSel).replace(/^./, c => c.toUpperCase()))}</div>
  ${selL.length ? selL.map(x => intCard(x, {noTec: !!fixedTec, addr: !!fixedTec, giorno: ui.calSel}).replace('class="card tap"', `class="card tap wk" style="border-left-color:${tecColor(x.tecnico)}"`)).join("") : `<div class="empty">Nessun intervento in questo giorno.</div>`}
  ${selM.map(i => `<div class="card"><div class="row"><span class="t">🔧 Scade manutenzione · ${esc(cliName(i.clienteId))}</span></div><div class="m">${esc(impName(i))}</div><div style="margin-top:8px"><button class="btn sm" data-prog="${i.id}">Programma</button></div></div>`).join("")}` : ""}`;
}

// Telefono: fotocamera dal vivo. Lettore integrato del browser (BarcodeDetector) se c'è, altrimenti libreria ZXing (caricata da internet).
// PC: il codice si scrive, arriva da un lettore USB, oppure lo legge il telefono (stessa richiesta delle foto, tipo "barcode").
let zxP = null;
function loadZX(){
  if (window.ZXing && window.ZXing.BrowserMultiFormatReader) return Promise.resolve();
  if (!zxP) zxP = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; sc.onload = () => res(); sc.onerror = () => { zxP = null; rej(new Error("load")); }; document.head.appendChild(sc); });
  return zxP;
}
const normCod = c => String(c || "").trim().toUpperCase().replace(/\s+/g, "");
function leggiCodice(titolo){
  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "ov"; ov.style.zIndex = 95;
    ov.innerHTML = `<div class="dlg" style="text-align:center">
      <h2>▦ ${esc(titolo || "Leggi il codice a barre")}</h2>
      <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3">
        <video id="bcvid" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;display:block"></video>
        <div aria-hidden="true" style="position:absolute;left:8%;right:8%;top:50%;height:2px;background:#E8382F;box-shadow:0 0 8px #E8382F"></div>
      </div>
      <p class="m" id="bcst" style="margin:8px 0">Avvio la fotocamera…</p>
      <label class="lb" for="bcin" style="display:block;text-align:left">Non lo legge? Scrivi il codice</label>
      <div class="row" style="gap:8px"><input id="bcin" autocomplete="off" style="flex:1"><button class="btn pri" data-x="ok">Usa</button></div>
      <div class="acts"><span class="sp"></span><button class="btn" data-x="no">Annulla</button></div></div>`;
    document.body.appendChild(ov);
    const vid = ov.querySelector("#bcvid"), st = ov.querySelector("#bcst");
    let finito = false, stream = null, timer = null, reader = null;
    const fine = code => {
      if (finito) return; finito = true;
      try { if (timer) clearTimeout(timer); } catch(e){}
      try { if (reader) reader.reset(); } catch(e){}
      try { (stream || vid.srcObject)?.getTracks().forEach(t => t.stop()); } catch(e){}
      ov.remove();
      if (code && navigator.vibrate) { try { navigator.vibrate(80); } catch(e){} }
      resolve(code ? String(code).trim() : null);
    };
    ov.addEventListener("click", e => { const a = e.target.dataset.x; if (a === "no") fine(null); if (a === "ok") { const v = ov.querySelector("#bcin").value.trim(); if (v) fine(v); } });
    ov.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "bcin") { e.preventDefault(); const v = e.target.value.trim(); if (v) fine(v); } });
    const pronto = () => { st.textContent = "Inquadra il codice a barre sulla linea rossa"; };
    (async () => {
      try {
        if ("BarcodeDetector" in window) {
          const det = new window.BarcodeDetector();
          stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}, audio: false});
          if (finito) { stream.getTracks().forEach(t => t.stop()); return; }
          vid.srcObject = stream; await vid.play().catch(() => {}); pronto();
          const giro = async () => {
            if (finito) return;
            try { const r = await det.detect(vid); if (r && r.length && r[0].rawValue) return fine(r[0].rawValue); } catch(e){}
            timer = setTimeout(giro, 180);
          };
          giro();
        } else {
          await loadZX(); if (finito) return;
          reader = new window.ZXing.BrowserMultiFormatReader();
          pronto();
          reader.decodeFromConstraints({video: {facingMode: "environment"}}, vid, (res) => { if (res && !finito) fine(res.getText ? res.getText() : res.text); });
        }
      } catch(e) {
        st.textContent = "Non riesco ad aprire la fotocamera: scrivi il codice qui sotto (o controlla il permesso della fotocamera)." + errDet(e);
      }
    })();
  });
}
function trovaCodice(code){
  const n = normCod(code); if (!n) return null;
  const a = S.magazzino.find(x => normCod(x.ean) === n || normCod(x.codice) === n);
  if (a) return {tipo: "mag", a};
  for (const ch of S.listino) for (const it of (ch.items || [])) if (normCod(it.codice) === n) return {tipo: "lis", it};
  return null;
}

async function stepSconto(id, delta){
  if (magBusy.has(id)) return; const m = byId("magazzino", id); if (!m || !num(m.prezzoListino)) return;
  magBusy.add(id);
  const sc = Math.min(100, Math.round((num(m.sconto) + delta) * 10) / 10);
  try { await patch("magazzino", id, {sconto: sc, prezzoVendita: priceFromSc(m.prezzoListino, sc)}); } catch(e){}
  magBusy.delete(id);
}
function magFiltered(){

  let l = S.magazzino.filter(m => !terms.length || terms.every(t => [m.descrizione, m.codice, m.fornitore, m.serie].join(" ").toLowerCase().includes(t)));
  if (ui.magForn) l = l.filter(m => (m.fornitore || "") === ui.magForn);
  if (ui.magCat) l = l.filter(m => m.categoria === ui.magCat);
  if (ui.magLow) l = l.filter(m => num(m.quantita) <= num(m.scortaMinima));
  return l;
}

async function runMagImport(list){
  const ov = modal(`<h2>Importazione in corso…</h2><p class="m">Non chiudere il gestionale finché non finisce.</p><div class="info" id="mprog">0 / ${list.length}</div><div class="acts"><span class="sp"></span><button class="btn" data-a="stop">Interrompi</button></div>`);
  let stop = false; ov.addEventListener("click", e => { if (e.target.closest("[data-a=stop]")) stop = true; });
  ov.onclick = null;
  let done = 0, nuovi = 0, agg = 0, err = 0;
  const one = async j => {
    const ex = byId("magazzino", j.id);
    const prezzi = {prezzoListino: j.pl, sconto: j.sc, prezzoVendita: j.pc, ...(j.pa !== "" ? {prezzoAcquisto: j.pa} : {})};
    for (let t = 0; t < 6; t++) {
      try {
        if (ex) { await db.collection("magazzino").doc(j.id).update({...prezzi, ...(j.it.img && !ex.img && !ex.foto ? {img: j.it.img} : {}), aggiornato: new Date().toISOString()}); agg++; }
        else { await db.collection("magazzino").doc(j.id).set({...(j.it.img ? {img: j.it.img} : {}), codice: j.it.codice || "", descrizione: j.it.descrizione, categoria: magCatOf(j.it), serie: j.it.categoria || "", fornitore: j.forn, unita: /al metro/i.test(j.it.descrizione) ? "m" : "pz", quantita: 0, scortaMinima: 0, ...prezzi, aggiornato: new Date().toISOString()}); nuovi++; }
        return;
      } catch(e) {
        if (e && (e.code === "resource_exhausted" || e.code === "unavailable")) { await new Promise(r => setTimeout(r, 1500 * (t + 1))); continue; }
        if (e && e.code === "quota_exceeded") { stop = true; toast("Spazio dati esaurito", 5000); }
        err++; return;
      }
    }
    err++;
  };
  for (let i = 0; i < list.length && !stop; i += 4) {
    await Promise.all(list.slice(i, i + 4).map(one));
    done = Math.min(list.length, i + 4);
    const el = document.getElementById("mprog"); if (el) el.textContent = `${done} / ${list.length}`;
  }
  ov.remove();
  toast(`✅ Magazzino: ${nuovi} nuovi, ${agg} aggiornati${err ? `, ${err} non riusciti (rilancia l'importazione)` : ""}`, 6000);
  render();
}

function vcardTesto(d){

  if (d.foto) L.push(...foldV("PHOTO;ENCODING=b;TYPE=JPEG:" + d.foto));

const costoMat = m => { if (m.costo != null && m.costo !== "") return num(m.costo); const a = byId("magazzino", m.articoloId); return a ? num(a.prezzoAcquisto) : 0; };
function margineInt(x){
  const r = x.rapportino || {}; const ore = num(r.minutiLavoro) / 60;
  const matV = (r.materiali || []).reduce((s, m) => s + num(m.prezzo) * num(m.qta), 0);
  const matC = (r.materiali || []).reduce((s, m) => s + costoMat(m) * num(m.qta), 0);
  const lavC = ore * num(CFG.costoInterno) * Math.max(1, tecDi(x).length);
  const fat = S.fatture.filter(f => f.interventoId === x.id);
  const ric = fat.length ? fat.reduce((s, f) => s + num(f.imponibile), 0) : matV + ore * num(CFG.costoOra);
  const costo = matC + lavC;
  return {ore, matV, matC, lavC, ric, costo, margine: ric - costo, stimato: !fat.length};
}
const rigaOre = r => /\(\s*[\d.,]+\s*h\s*×/.test(r.descrizione || "") || r.unita === "ore";
const rigaGiorni = r => /\(\s*[\d.,]+\s*gg\s*×/.test(r.descrizione || "") || r.unita === "giorni";
function marginePrev(p){
  const t = prevTot(p); let costo = 0, note = 0, tot = 0;
  (p.righe || []).forEach(r => {
    tot++;
    if (rigaOre(r)) { costo += num(r.qta) * num(CFG.costoInterno); if (num(CFG.costoInterno)) note++; return; }
    if (rigaGiorni(r)) { costo += num(r.qta) * 8 * num(CFG.costoInterno); if (num(CFG.costoInterno)) note++; return; }
    const c = r.costo != null && r.costo !== "" ? num(r.costo) : costoDaListino(r);
    if (c) { costo += c * num(r.qta); note++; }
  });
  return {imp: t.imp, costo, margine: t.imp - costo, note, tot};
}
function costoDaListino(r){
  const cod = r.codice || ((r.descrizione || "").match(/^([A-Z0-9][A-Z0-9+\/\-.]{3,}) - /) || [])[1] || "";
  if (!cod) return 0;
  const offerte = fontiPrezzo().filter(o => o.codice && (normC(o.codice) === normC(cod) || (normC(cod).length >= 6 && (normC(o.codice).endsWith(normC(cod)) || normC(cod).endsWith(normC(o.codice))))));
  return offerte.length ? Math.min(...offerte.map(o => o.costo)) : 0;
}

// ---- confronto prezzi tra fornitori ----
const normC = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const STOP = new Set(["per", "con", "da", "di", "del", "della", "al", "metro", "the", "and", "in", "su", "tipo", "serie", "mm", "conf", "pz"]);
const parole = d => String(d || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\([^)]*\)/g, " ").split(/[^a-z0-9/]+/).filter(w => w.length >= 3 && !STOP.has(w) && !/^\d/.test(w));
const misura = d => { const s = String(d || "").toLowerCase(); const m = s.match(/(\d+\s?\d*\/\d+)"?|(?:d\.|ø|diam\.?\s?|dn\s?)\s?(\d+)/); return m ? (m[1] || "d" + m[2]).replace(/\s/g, "") : ""; };
let FONTI = null, FONTI_K = "";
function fontiPrezzo(){
  const k = LISTINO.length + ":" + S.magazzino.length;
  if (FONTI && FONTI_K === k) return FONTI;
  const L = [], vis = new Set();
  const add = o => { const key = o.fornitore + "|" + normC(o.codice || o.descrizione); if (vis.has(key) || !o.costo) return; vis.add(key); L.push({...o, w: parole(o.descrizione), mis: misura(o.descrizione)}); };
  LISTINO.filter(i => num(i.costo)).forEach(i => add({fornitore: i.marca, codice: i.codice, descrizione: i.descrizione, costo: num(i.costo), fonte: i.fonte || ""}));
  S.magazzino.filter(m => num(m.prezzoAcquisto) && m.fornitore).forEach(m => add({fornitore: m.fornitore, codice: m.codice, descrizione: m.descrizione, costo: num(m.prezzoAcquisto)}));
  FONTI = L; FONTI_K = k; return L;
}
function stessoArticolo(a, b){
  if (a.fornitore === b.fornitore) return false;
  const ca = normC(a.codice), cb = normC(b.codice);
  if (ca.length >= 6 && cb.length >= 6 && (ca === cb || ca.endsWith(cb) || cb.endsWith(ca))) return true;
  if (!a.mis || a.mis !== b.mis || !a.w.length || !b.w.length || a.w[0] !== b.w[0]) return false;
  const inter = a.w.filter(w => b.w.includes(w)).length;
  return inter >= 2 && inter / Math.min(a.w.length, b.w.length) >= 0.6;
}
function alternative(it){
  const o = {fornitore: it.marca || it.fornitore, codice: it.codice, descrizione: it.descrizione}; o.w = parole(o.descrizione); o.mis = misura(o.descrizione);
  return fontiPrezzo().filter(x => stessoArticolo(o, x)).sort((a, b) => a.costo - b.costo);
}
function hintPrezzo(it){
  if (ui.modo !== "ufficio") return "";
  const mio = num(it.costo) || num(it.prezzoAcquisto); if (!mio) return "";
  const alt = alternative(it).filter(a => a.costo < mio - 0.005);
  return alt.length ? `<div class="m" style="color:var(--ok)">💡 Costa meno da <b>${esc(alt[0].fornitore)}</b>: ${eur(alt[0].costo)} invece di ${eur(mio)}</div>` : "";
}
function vPrezzi(){
  const q = (ui.q || "").trim().toLowerCase();
  const F = fontiPrezzo(), usati = new Set(), gruppi = [];
  F.forEach((a, i) => { if (usati.has(i)) return; const g = [a]; F.forEach((b, j) => { if (j > i && !usati.has(j) && g.every(x => stessoArticolo(x, b) || stessoArticolo(b, x))) { g.push(b); usati.add(j); } }); if (new Set(g.map(x => x.fornitore)).size > 1) gruppi.push(g.sort((x, y) => x.costo - y.costo)); });
  const vis = gruppi.filter(g => !q || g.some(x => (x.descrizione + " " + x.codice + " " + x.fornitore).toLowerCase().includes(q))).sort((a, b) => (b[b.length - 1].costo - b[0].costo) - (a[a.length - 1].costo - a[0].costo));
  return `<p class="m">Lo stesso articolo venduto da più fornitori, con il tuo prezzo d'acquisto. In verde il più conveniente. Confronto fatto su ${F.length} prezzi dei listini fornitori e del magazzino.</p>
  <input class="search" placeholder="Cerca articolo (es. rame 3/8, spiro 250)…" value="${esc(ui.q)}" data-q>
  ${vis.length ? vis.slice(0, 80).map(g => `<div class="card"><div class="t">${esc(g[0].descrizione)}</div>${g.map((x, i) => `<div class="row" style="padding:3px 0;border-top:${i ? "1px solid var(--line)" : "0"}"><span style="flex:1">${i === 0 ? "✅ " : ""}<b>${esc(x.fornitore)}</b> <span class="m">${esc(x.codice || "")}</span></span><b class="money" style="color:${i === 0 ? "var(--ok)" : "inherit"}">${eur(x.costo)}</b></div>`).join("")}
    ${g.length > 1 ? `<div class="m" style="margin-top:4px">Risparmio scegliendo ${esc(g[0].fornitore)}: <b>${eur(g[g.length - 1].costo - g[0].costo)}</b> a pezzo (${perc(g[g.length - 1].costo - g[0].costo, g[g.length - 1].costo)}%)</div>` : ""}</div>`).join("") : empty(F.length ? "Nessun articolo in comune tra fornitori diversi." : "Carica prima i listini dei fornitori (Preventivi → Listino).")}`;
}

// a quale fornitore comprare un articolo: il più conveniente tra listini e magazzino, altrimenti quello del magazzino
function fornitorePer(r){
  const a = r.articoloId && byId("magazzino", r.articoloId);
  const alt = alternative({marca: "", codice: r.codice || a?.codice || "", descrizione: r.descrizione || a?.descrizione || ""});
  const diretto = fontiPrezzo().filter(o => o.codice && normC(o.codice) === normC(r.codice || a?.codice || ""));
  const tutte = [...diretto, ...alt].sort((x, y) => x.costo - y.costo);
  if (tutte.length) return {fornitore: tutte[0].fornitore, costo: tutte[0].costo};
  if (a && a.fornitore) return {fornitore: a.fornitore, costo: num(a.prezzoAcquisto)};
  return {fornitore: "", costo: num(r.costo)};
}
const ordTot = o => (o.righe || []).reduce((s, r) => s + num(r.qta) * num(r.prezzo), 0);

// ---- contabilità: fatture fornitori e DDT (solo titolare e chi è abilitato) ----
const TIPI_CONT = ["Fattura fornitore", "DDT", "Nota di credito", "Altro"];
function caricaContab(){
  if (!assetsNS) { toast("Il caricamento dei file non è attivo: controlla la connessione"); return; }
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/pdf,image/*"; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files]; if (!files.length) return;
    const caricati = []; let i = 0;
    for (const f of files) {
      i++; toast(`Carico ${i} di ${files.length}…`, 60000);
      try { let blob = f, type = f.type || "application/pdf"; if (type.startsWith("image/")) { const r = await shrinkImage(f, 2400); if (r) { blob = r.blob; type = r.type; } }
        const up = await assetsNS.upload(blob, {type, cartella: "contabilita"}); caricati.push({id: up.id, url: up.url, path: up.path || "", nome: f.name, tipo: type}); }
      catch(e) { clearToasts(); toast("Caricamento non riuscito: " + f.name + errDet(e), 5000); }
    }
    clearToasts(); if (!caricati.length) return;
    const tipoDa = n => /ddt|bolla|d\.d\.t/i.test(n) ? "DDT" : "Fattura fornitore";
    formContab({tipo: tipoDa(caricati[0].nome), file: caricati[0], altri: caricati.slice(1)});
  };
  inp.click();
}

function render(){
  setTimeout(controllaCondivisi, 0); setTimeout(controllaLinkImpianto, 0);
  if (ui.modo && !modiConsentiti().includes(ui.modo)) { ui.modo = ""; ls.set("modo", ""); }
  const acc = mioAccount();
  if (acc) {
    // con l'account: identità sempre quella dell'account, e se c'è una sola area si entra direttamente
    if (ui.modo === "tecnico" && !mioTecnico()) { ui.modo = ""; ls.set("modo", ""); }
    if (ui.modo) entraModo(ui.modo);
    else { const mc = modiConsentiti(); if (mc.length === 1 && (mc[0] !== "tecnico" || mioTecnico())) entraModo(mc[0]); }
  }
  if (!acc && ui.modo === "ufficio" && CFG.pinUfficio && ls.get("uffPin", "") !== CFG.pinUfficio) { ui.modo = ""; ls.set("modo", ""); }
  if (ui.modo === "tecnico" && TEC().length && !TEC().some(t => sameTec(t.nome, ui.tecnico))) { ui.modo = ""; ls.set("modo", ""); toast("Il tuo profilo tecnico è cambiato: rientra con il tuo codice", 4000); }
  const app = $("#app"), nav = $("#nav"), fab = $("#fabwrap");
  const focusQ = document.activeElement && document.activeElement.hasAttribute("data-q");
  const caret = focusQ ? document.activeElement.selectionStart : 0;
  let banner = "";
  if (ui.stale === "nodb") banner = `<div class="banner warn">I dati non sono raggiungibili. Controlla la connessione a internet e riapri l’app.</div>`;
  else if (ui.stale) banner = `<div class="banner warn">${navigator.onLine ? "Connessione lenta" : "Sei offline"}: stai vedendo i dati salvati sul dispositivo, le modifiche verranno inviate appena torna la connessione.</div>`;
  if (!canWrite && !readOnlyNoted) banner += `<div class="banner warn">Hai accesso in sola lettura. Per inserire dati chiedi al titolare di attivare il tuo account (👤 → Utenti).</div>`;
  $("#hqr").hidden = !ui.modo; $("#hset").hidden = ui.modo !== "ufficio"; $("#htec").hidden = ui.modo !== "ufficio";
  $("#hmode").hidden = !ui.modo || (!!acc && modiConsentiti().length === 1);
  $("#hwho").textContent = ui.modo === "tecnico" ? "🔧 " + ui.tecnico : ui.modo === "comm" ? "📋 " + ui.comm : ui.modo === "ufficio" ? "🏢 " + (ui.uff || "Ufficio") : "";
  if (!ui.modo) { nav.hidden = true; fab.innerHTML = ""; app.innerHTML = banner + vChoose(); return; }
  if (ui.modo === "comm") { nav.hidden = true; fab.innerHTML = ""; app.innerHTML = banner + vComm(); if (focusQ) { const el = app.querySelector("[data-q]"); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} } } return; }
  if (ui.modo === "tecnico") {
    nav.hidden = true; fab.innerHTML = "";
    app.innerHTML = banner + vTecnico(); return;
  }
  const nVer = S.interventi.filter(x => x.rapportino && !x.verificato).length;
  nav.hidden = false;
  nav.innerHTML = NAV.map(([k, l, ic]) => `<button class="${ui.tab === k ? "on" : ""}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${l}${(k === "oggi" || k === "interventi") && nVer ? `<span class="badge">${nVer}</span>` : ""}</button>`).join("");
  const V = {oggi: vOggi, calendario: () => vCalendario(), interventi: vInterventi, clienti: vClienti, documenti: vDocumenti, magazzino: vMagazzino, altro: vAltro};
  app.innerHTML = banner + (V[ui.tab] || vOggi)();
  const fabs = {oggi: ["newint", "+ Intervento"], calendario: ["calnewsel", "+ Intervento"], interventi: ["newint", "+ Intervento"], clienti: ui.cliente ? ["cliint", "+ Intervento"] : ["newcli", "+ Cliente"], documenti: ui.docTab === "dico" ? ["newdico", "+ DiCo"] : ui.docTab === "preventivi" ? ["newprev", "+ Preventivo"] : ui.docTab === "fatture" ? ["newfat", "+ Fattura"] : null, magazzino: ["newart", "+ Articolo"]};
  const fb = fabs[ui.tab]; fab.innerHTML = fb ? `<button class="fab" data-a="${fb[0]}">${fb[1]}</button>` : "";
  if (focusQ) { const el = app.querySelector("[data-q]"); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} } }
}

// ---------- eventi ----------
document.addEventListener("input", e => { if (e.target.hasAttribute && e.target.hasAttribute("data-q")) { ui.q = e.target.value; render(); } });
document.addEventListener("change", e => {
  if (e.target.hasAttribute && e.target.hasAttribute("data-inttec")) { ui.intTec = e.target.value; render(); }
  if (e.target.hasAttribute && e.target.hasAttribute("data-caltec")) { ui.calTec = e.target.value; render(); }
  if (e.target.id === "tecsel") { $("#tecnew").hidden = e.target.value !== "__new"; }
});
document.addEventListener("click", async e => {
  if (e.target.closest(".ov") || e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-tab],[data-a],[data-int],[data-cli],[data-imp],[data-prev],[data-fat],[data-paga],[data-art],[data-mq],[data-intf],[data-doc],[data-fatf],[data-cat],[data-go],[data-scroll],[data-prog],[data-mode],[data-tecf],[data-start],[data-rap],[data-take],[data-cald],[data-calv],[data-calmv],[data-calnew],[data-tcli],[data-cf],[data-bundle],[data-scs],[data-dico],[data-orem],[data-ics],[data-push]");
  if (!el) return; const d = el.dataset;
  if (d.tab) return go(d.tab);
  if (d.mode) {
    if (!modiConsentiti().includes(d.mode)) { toast("Il tuo account non ha accesso a questa area"); return; }
    if (mioAccount()) { if (d.mode === "tecnico" && !mioTecnico()) return toast("Account non collegato a un tecnico"); entraModo(d.mode); return render(); }
    if (d.mode === "ufficio") {
      const enter = () => { ui.modo = "ufficio"; ui.uff = d.uff || ""; ls.set("modo", "ufficio"); ls.set("uff", ui.uff); ls.set("uffPin", CFG.pinUfficio || ""); render(); };
      if (!CFG.pinUfficio || ls.get("uffPin", "") === CFG.pinUfficio) return enter();
      return openForm({ title: "🏢 Ufficio · " + (d.uff || ""), saveLabel: "Entra", values: {},
        intro: `<p class="m" style="margin-top:-6px">Inserisci il PIN dell'ufficio. Su questo dispositivo non verrà più chiesto.</p>`,
        fields: [{k:"pin", label:"PIN", type:"password", req:true}],
        onSave: async v => { if (String(v.pin).trim() !== CFG.pinUfficio) { toast("PIN non corretto"); throw new Error("pin"); } setTimeout(enter, 30); } });
    }
    if (d.mode === "comm") { const n = ($("#commname").value || "").trim(); if (!n) { toast("Scrivi il tuo nome"); return; } ui.modo = "comm"; ui.comm = n; ui.q = ""; ls.set("modo", "comm"); ls.set("comm", n); return render(); }
    let name = "";
    if ($("#teccode")) { const t = tecByCode($("#teccode").value); if (!t) { toast("Codice tecnico non valido: chiedilo all'ufficio", 3500); return; } name = t.nome; }
    else name = ($("#tecnew")?.value || "").trim();
    if (!name) { toast("Scrivi il tuo nome"); return; }
    ui.modo = "tecnico"; ui.tecnico = name; ls.set("modo", "tecnico"); ls.set("tecnico", name); return render();
  }
  if (d.paga) { e.stopPropagation(); await patch("fatture", d.paga, {pagata: true, dataPagamento: today()}); return toast("Fattura segnata come pagata"); }
  if (d.mq) { el.disabled = true; const a = byId("magazzino", d.mq); try { await patch("magazzino", a.id, {quantita: Math.max(0, num(a.quantita) + Number(d.d))}); } catch(err){} el.disabled = false; return; }
  if (d.prog) { const i = byId("impianti", d.prog); return formIntervento({clienteId: i.clienteId, impiantoId: i.id, tipo: "Manutenzione", data: i.prossimaManutenzione >= today() ? i.prossimaManutenzione : today(), descrizione: "Manutenzione periodica"}); }
  if (d.start) { el.disabled = true; try { await startJob(byId("interventi", d.start)); } catch(err){} return; }
  if (d.rap) return formRapportino(byId("interventi", d.rap));
  if (d.take) { await patch("interventi", d.take, {tecnico: ui.tecnico}); return toast("Lavoro assegnato a te"); }
  if (d.int) return detIntervento(byId("interventi", d.int));
  if (d.cli) { ui.cliente = d.cli; render(); return window.scrollTo(0, 0); }
  if (d.imp) return detImpianto(byId("impianti", d.imp));
  if (d.prev) return detPreventivo(byId("preventivi", d.prev));
  if (d.fat) return formFattura(byId("fatture", d.fat));
  if (d.art) return formArticolo(byId("magazzino", d.art));
  if (d.intf) { ui.intF = d.intf; return render(); }
  if (d.cald) { ui.calSel = d.cald; if (d.cald.slice(0, 7) !== ui.calM) ui.calM = d.cald.slice(0, 7); render(); return giornoPopup(d.cald); }
  if (d.calv) { ui.calView = d.calv; if (d.calv === "mese") ui.calM = (ui.calSel || today()).slice(0, 7); return render(); }
  if (d.calmv !== undefined) {
    const k = Number(d.calmv);
    if (k === 0) { ui.calSel = today(); ui.calM = ui.calSel.slice(0, 7); }
    else if (ui.calView === "mese") { const m = addMonths((ui.calM || today().slice(0, 7)) + "-01", k); ui.calM = m.slice(0, 7); ui.calSel = m; }
    else { ui.calSel = addDays(ui.calSel || today(), 7 * k); ui.calM = ui.calSel.slice(0, 7); }
    return render();
  }
  if (d.calnew) return formIntervento({data: d.calnew});
  if (d.dico) return detDico(byId("dico", d.dico));
  if (d.orem) { const k = Number(d.orem); ui.oreM = addMonths((ui.oreM || today().slice(0, 7)) + "-15", k).slice(0, 7); return render(); }
  if (d.scs) { e.stopPropagation(); return stepSconto(d.scs, Number(d.d)); }
  if (d.bundle) { el.disabled = true; await loadBundle(d.bundle); el.disabled = false; return; }
  if (d.tcli) return detTecCliente(d.tcli);
  if (d.cf) { ui.cF = d.cf; ui.q = ""; render(); return window.scrollTo(0, 0); }
  if (d.tecf) { ui.tecF = d.tecf; return render(); }
  if (d.ics) return apriIcs(mieiProssimi(), "Appuntamenti iTeam");
  if (d.push) { try { await window.ITEAM.notifiche.attiva(ui.tecnico); toast("✅ Notifiche attivate"); } catch(err) { toast(err && err.message || "Non riuscito", 4500); } return render(); }
  if (d.doc) { ui.docTab = d.doc; ui.q = ""; return render(); }
  if (d.fatf) { ui.fatF = d.fatf; return render(); }
  if (d.cat !== undefined) { ui.magCat = d.cat; ui.magLow = false; return render(); }
  if (d.go) { const [tab, sub] = d.go.split(":"); if (tab === "interventi") ui.intF = sub; if (tab === "documenti") { ui.docTab = sub; ui.fatF = "aperte"; } return go(tab); }
  if (d.scroll) { document.getElementById(d.scroll)?.scrollIntoView({behavior: "smooth"}); return; }
  const a = d.a;
  if (a === "newcli") formCliente();
  if (a === "impcli") importaRubrica();
  if (a === "editcli") formCliente(byId("clienti", ui.cliente));
  if (a === "back") { ui.cliente = null; render(); }
  if (a === "newint") formIntervento();
  if (a === "calnewsel") formIntervento({data: ui.calSel || today()});
  if (a === "cliint") formIntervento({clienteId: ui.cliente});
  if (a === "cliimp") formImpianto({clienteId: ui.cliente});
  if (a === "cliprev") formPreventivo({clienteId: ui.cliente});
  if (a === "newprev") formPreventivo();
  if (a === "newfat") formFattura();
  if (a === "newart") formArticolo();
  if (a === "artfoto") nuovoArtFoto();
  if (a === "artscan") scansionaArticolo();
  if (a === "low") { ui.magLow = !ui.magLow; ui.magCat = ""; render(); }
  if (a === "set") formImpostazioni();
  if (a === "tecnew") formTecNew();
  if (a === "limport") importListino();
  if (a === "lnew") formListinoItem();
  if (a === "magimp") formImportMag();
  if (a === "magsc") formScontoMassivo();
  if (a === "orecsv") { const rows = S.interventi.filter(x => x.rapportino && (x.data || "").startsWith(ui.oreM)).sort(sortInt); saveCsv(`Ore tecnici ${ui.oreM}.csv`, ["Data", "Tecnico", "Cliente", "Tipo", "Inizio", "Fine", "Pausa min", "Ore lavorate", "Viaggio min", "Lavori", "Materiali", "Esito"], rows.map(x => { const r = x.rapportino; return [x.data, tecTxt(x) || r.inviatoDa || "", cliName(x.clienteId), x.tipo || "", r.inizio, r.fine, r.pausaMin || 0, String(r2(num(r.minutiLavoro) / 60)).replace(".", ","), r.viaggioMin || 0, (r.lavori || []).join(", "), (r.materiali || []).map(m => m.qta + " " + m.descrizione).join(", "), r.esito || ""]; })); }
  if (a === "expcli") saveCsv("Clienti iTeam.csv", ["Nome", "Tipo", "Telefono", "Email", "Indirizzo", "CAP", "Città", "P.IVA/CF", "Referente", "Note"], clientiVisibili().map(c => [c.nome, c.tipo, c.telefono, c.email, c.indirizzo, c.cap, c.citta, c.piva, c.referente, c.note]));
  if (a === "expint") saveCsv("Interventi iTeam.csv", ["Data", "Ora", "Cliente", "Tipo", "Tecnico", "Stato", "Descrizione", "Ore lavorate", "Esito"], S.interventi.slice().sort(sortInt).map(x => [x.data, x.ora, cliName(x.clienteId), x.tipo, tecTxt(x), x.stato, x.descrizione, x.rapportino ? String(r2(num(x.rapportino.minutiLavoro) / 60)).replace(".", ",") : "", x.rapportino?.esito || ""]));
  if (a === "expmag") saveCsv("Magazzino iTeam.csv", ["Codice", "Descrizione", "Fornitore", "Categoria", "Serie", "Quantità", "Unità", "Scorta minima", "Prezzo listino", "Sconto %", "Prezzo cliente", "Costo"], S.magazzino.map(m => [m.codice, m.descrizione, m.fornitore, m.categoria, m.serie, m.quantita, m.unita, m.scortaMinima, m.prezzoListino, m.sconto, m.prezzoVendita, m.prezzoAcquisto].map(v => typeof v === "number" ? String(v).replace(".", ",") : v)));
  if (a === "expfat") saveCsv("Fatture iTeam.csv", ["Numero", "Data", "Cliente", "Descrizione", "Imponibile", "IVA %", "Totale", "Scadenza", "Pagata", "Data pagamento"], S.fatture.map(f => [f.numero, f.data, cliName(f.clienteId), f.descrizione, String(num(f.imponibile)).replace(".", ","), f.iva, String(r2(fatTot(f))).replace(".", ","), f.scadenza, f.pagata ? "Sì" : "No", f.dataPagamento]));
  if (a === "newdico") formDico();
  if (a === "lclear") { if (await ask(`Eliminare tutti i ${LISTINO.length} articoli del listino?`)) { for (const ch of S.listino.slice()) await remove("listino", ch.id); toast("Listino svuotato"); } }
  if (a === "qfree") { QT.righe.push({tipo: "libera", codice: "", descrizione: "", qta: 1, listino: "", sconto: 0}); qtSave(); render(); setTimeout(() => { const el = document.querySelectorAll('[data-qf="descrizione"]'); el[el.length - 1]?.focus(); }, 50); }
  if (a === "qclear") { if (await ask("Svuotare il preventivatore?", "Svuota")) { QT = QT_EMPTY(); qtSave(); render(); } }
  if (a === "qsave") qtCreate();
  if (a === "qprev") qtAnteprima();
  if (a === "qshow") showProducts(QT.righe.filter(r => r.tipo === "prod").map(r => ({img: r.img, descrizione: r.descrizione, potenza: r.potenza, prezzo: r2(rowNet(r)), qta: r.qta})), byId("clienti", QT.clienteId)?.nome ? "Proposta per " + byId("clienti", QT.clienteId).nome : "");
  if (a === "qora" || a === "qgiorno") { const ore = a === "qora"; QT.righe.push({tipo: "man", unita: ore ? "ore" : "giorni", codice: "", descrizione: ore ? "Manodopera tecnico (a ore)" : "Manodopera tecnico (a giornata)", qta: 1, listino: ore ? CFG.costoOra : CFG.costoGiornata, sconto: 0}); qtSave(); render(); toast(ore ? "Aggiunte ore tecnico: imposta il numero di ore" : "Aggiunta giornata tecnico: imposta il numero di giorni", 2200); }
  if (a === "tecnewcli") formCliente({});
});
$("#hguida").addEventListener("click", vGuida);
$("#hset").addEventListener("click", formImpostazioni);
$("#htec").addEventListener("click", vTecnici);
$("#hqr").addEventListener("click", vBiglietto);
$("#hmode").addEventListener("click", () => { ui.modo = ""; ls.set("modo", ""); render(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (NAV.some(n => n[0] === h) && h !== ui.tab) { ui.tab = h; ui.cliente = null; render(); } });
{ const h = location.hash.slice(1); if (NAV.some(n => n[0] === h)) ui.tab = h; }

render();
initDb();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
