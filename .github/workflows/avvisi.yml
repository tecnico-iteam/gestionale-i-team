# Controlla gli appuntamenti ogni 10 minuti: notifiche ai tecnici (scripts/avvisi.js)
# e, dalle 17, email di promemoria ai clienti per gli appuntamenti di domani (scripts/promemoria-clienti.js).
name: Avvisi appuntamenti
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: avvisi
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  avvisi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa il collegamento a Firebase
        run: npm install --prefix scripts --no-save --no-audit --no-fund firebase-admin@12 nodemailer@6
      - name: Manda gli avvisi
        run: node scripts/avvisi.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Allarmi ai tecnici (riserva, se quelli delle 8 e 17:30 sono in ritardo)
        if: always()
        run: node scripts/allarmi.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Cambio password decisi dal titolare
        if: always()
        run: node scripts/password.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Trasferimento dal calendario dell'iPhone
        if: always()
        run: node scripts/calendari.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Promemoria ai clienti (email)
        run: node scripts/promemoria-clienti.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
