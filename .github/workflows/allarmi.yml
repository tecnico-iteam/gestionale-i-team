# Allarmi ai tecnici dal lunedì al venerdì (scripts/allarmi.js):
#  - 8:00 "hai aperto l'attività?"   - 17:30 "hai compilato il rapportino?"
# Due orari per ciascuno (ora legale e solare); lo script aspetta l'ora esatta. Riserva: il workflow degli avvisi.
name: Allarmi tecnici
on:
  schedule:
    - cron: "40 5 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "10 15 * * 1-5"
    - cron: "10 16 * * 1-5"
  workflow_dispatch:
concurrency:
  group: allarmi-tecnici
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  allarme:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-save --no-audit --no-fund firebase-admin@12
      - name: Allarme
        run: node scripts/allarmi.js --aspetta
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
